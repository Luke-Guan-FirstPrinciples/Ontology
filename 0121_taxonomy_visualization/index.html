<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhySH Taxonomy Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="theme-dark">
    <div class="app-container">
        <!-- Sidebar: Filters & Search -->
        <aside class="sidebar">
            <div class="brand">
                <h1>PhySH <span class="accent">Atlas</span></h1>
                <p class="subtitle">Physics Subject Headings</p>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search concepts..." autocomplete="off">
                <div class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Facet</label>
                    <select id="facetFilter">
                        <option value="all">All Facets</option>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="filter-group">
                    <label>Discipline</label>
                    <select id="disciplineFilter">
                        <option value="all">All Disciplines</option>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="filter-group">
                    <label>Max Depth</label>
                    <input type="range" id="depthFilter" min="1" max="10" value="10" title="Depth Filter">
                    <span id="depthValue">All</span>
                </div>
            </div>

            <nav class="nav-links">
                <a href="#" class="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12H3" />
                        <path d="M21 6H3" />
                        <path d="M21 18H3" />
                    </svg>
                    Taxonomy Tree
                </a>
                <a href="graph/index.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3" />
                        <circle cx="6" cy="12" r="3" />
                        <circle cx="18" cy="19" r="3" />
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                    </svg>
                    Network Graph
                </a>
            </nav>

            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-val" id="totalConcepts">0</span>
                    <span class="stat-lbl">Concepts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="totalPapers">0</span>
                    <span class="stat-lbl">Papers</span>
                </div>
            </div>
        </aside>

        <!-- Main Content: Tree Viz -->
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs" id="breadcrumbs">
                    <span>Root</span>
                </div>
                <div class="actions">
                    <button id="collapseAllBtn" class="btn-ghost">Collapse All</button>
                    <button id="expandAllBtn" class="btn-ghost">Expand All</button>
                </div>
            </header>

            <div class="tree-wrapper" id="treeWrapper">
                <!-- Tree injected here -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading Taxonomy Data...</p>
                </div>
            </div>
        </main>

        <!-- Details Panel -->
        <aside class="details-panel" id="detailsPanel">
            <div class="details-empty-state">
                <p>Select a concept to view details</p>
            </div>
            <div class="details-content hidden" id="detailsContent">
                <div class="details-header">
                    <h2 id="dLabel">Concept Name</h2>
                    <span class="badge" id="dId">ID</span>
                </div>

                <div class="details-section">
                    <h3>Definition</h3>
                    <p id="dDef" class="definition-text">No definition available.</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="val" id="dApsFreq">0</span>
                        <span class="lbl">APS Frequency</span>
                    </div>
                    <div class="stat-box">
                        <span class="val" id="dDepth">0</span>
                        <span class="lbl">Depth</span>
                    </div>
                </div>

                <div class="details-section">
                    <h3>Classifications</h3>
                    <div class="tags" id="dFacets"></div>
                    <div class="tags" id="dDisciplines"></div>
                </div>

                <div class="details-section">
                    <h3>Related Papers</h3>
                    <div class="paper-list" id="dPapers">
                        <!-- Papers injected here -->
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="data/concepts.js" defer></script>
    <script src="data/stats.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</body>

</html>
